name: tutur

services:
  ui:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:4321}
        BASE_PATH: ${BASE_PATH:-/}
        PUBLIC_SEARCH_API_URL: ${PUBLIC_SEARCH_API_URL:-http://localhost:3001}
    image: tutur:local
    ports:
      - "4321:4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: tutur:local
    command: ["bun", "api/src/index.js"]
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch(`http://127.0.0.1:${process.env.PORT}/health`); if (!r.ok) throw new Error(String(r.status));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
